services:
  tts-webui:
    image: "ghcr.io/rsxdalv/tts-webui:main"
    restart: unless-stopped
    # Published on loopback only. These services have no authentication by
    # default, so binding them to every host interface exposes them to the
    # local network. Override BIND_HOST=0.0.0.0 if you intend that.
    ports:
      - ${BIND_HOST:-127.0.0.1}:${TTS_PORT:-7770}:7770
      # include React UI
      - ${BIND_HOST:-127.0.0.1}:${UI_PORT:-3000}:3000
      - ${BIND_HOST:-127.0.0.1}:${OPENAI_API_PORT:-7778}:7778
    container_name: tts-webui
    volumes:
      - ./data:/app/tts-webui/data
      - ./outputs:/app/tts-webui/outputs
      - ./favorites:/app/tts-webui/favorites
      # - ./voices:/app/tts-webui/voices
    # environment:
    #   # Disable hard requirements for CUDA version ("requirement error: unsatisfied condition [...]")
    #   # This might still lead to errors but allows to run some models even if CUDA version is not met
    #   # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/docker-specialized.html#nvidia-disable-require-environment-variable
    #   NVIDIA_DISABLE_REQUIRE: 1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  # SQLite is used as the database - no separate container needed
  # Database files are stored in ./data/sqlite/
